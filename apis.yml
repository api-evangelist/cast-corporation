    verified: '2026-08-13'
    docs_status: 200
    docs_finding: >-
      Reference page documents four endpoints with paths, path/query parameters, the
      Authorization header, and full example JSON responses.
    spec_published: false
    note: >-
      API key issuance is by email to support@cast.app, so no unauthenticated call to
      this base was possible; the sibling In-app Delivery endpoint on the same host was
      probed live and returned 401.
- name: Cast In-app Delivery API
  description: >-
    Server-side endpoint for minting a personalized Cast presentation permalink for one
    contact in one project, in play (automated presentation), ama (Ask Me Anything),
    information (customer center), or page (website page) mode. Paired with the
    cast-inapp-loader.js client that renders the same experience as a floating launcher,
    an iframe, or a link inside the customer's own site. Used to drop personalized
    business reviews into emails, CRM records, support tickets, and customer portals.
  humanURL: https://school.cast.app/projects/campaigns-and-analytics/in-app-delivery/
  baseURL: https://cast.app/designer/api/v1
  tags:
  - Embeddable
  - Personalization
  - Presentations
  - Customer Experience
  properties:
