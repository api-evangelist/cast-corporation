apis:
- name: Cast Analytics API
  description: >-
    Read-only REST API for exporting Cast.app campaign performance data — per-campaign
    engagement summaries, paged engagement events (delivered / view / play / action /
    feedback) with contact and device detail, the campaign list for a project, and a
    cross-campaign analytics rollup. Intended for pulling Cast engagement into a BI tool,
    CRM, or custom dashboard. Tenant-scoped: the organization slug is embedded in the
    base path and read off the Cast Designer URL.
  humanURL: https://school.cast.app/cast-api/
  baseURL: https://cast.app/designer/{org_slug}/api
  tags:
  - Analytics
  - Customer Success
  - Reporting
  - Event
  tags_raw:
  - Analytics
  - Customer Success
  - Reporting
  - Events
